<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我的歌单 · 自动连播</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#58a6ff;--green:#3fb950;--pink:#ff7b72;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:radial-gradient(900px 500px at 20% -10%,rgba(88,166,255,.10),transparent 60%),var(--bg);
    font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif;color:var(--text);min-height:100vh;padding:30px 16px 60px;}
  .wrap{max-width:980px;margin:0 auto;}
  header{text-align:center;margin-bottom:22px;}
  header h1{font-size:26px;font-weight:700;}
  header .sub{color:var(--muted);font-size:13px;margin-top:6px;}
  .stage{position:sticky;top:12px;z-index:10;background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:16px;margin-bottom:24px;}
  .player-box{position:relative;width:100%;max-width:760px;margin:0 auto;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;}
  .player-box iframe{position:absolute;inset:0;width:100%;height:100%;border:0;}
  .unlock{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;cursor:pointer;
    background:radial-gradient(500px 300px at 50% 40%,rgba(88,166,255,.18),transparent 70%),rgba(13,17,23,.82);transition:opacity .25s;}
  .unlock.hide{opacity:0;pointer-events:none;}
  .unlock .big{font-size:32px;font-weight:800;color:#fff;letter-spacing:1px;}
  .unlock .tip{font-size:13px;color:#9fb3c8;text-align:center;padding:0 20px;line-height:1.6;}
  .unlock .warn{font-size:12px;color:#f0b429;margin-top:2px;}
  .now{display:flex;align-items:center;gap:14px;margin-top:14px;}
  .now .info{flex:1;min-width:0;}
  .now .label{font-size:12px;color:var(--muted);letter-spacing:1px;margin-bottom:4px;}
  .now .song{font-size:19px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .now .artist{font-size:14px;color:var(--accent);margin-top:3px;}
  .now .meta{font-size:12px;color:var(--muted);margin-top:3px;}
  .ctrls{display:flex;gap:10px;flex-shrink:0;}
  button{border:none;border-radius:11px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:transform .08s,filter .15s;color:#fff;}
  button:active{transform:scale(.96);}
  .btn-play{background:linear-gradient(135deg,#238636,#2ea043);box-shadow:0 6px 18px rgba(35,134,54,.35);}
  .btn-next{background:linear-gradient(135deg,#58a6ff,#1f6feb);box-shadow:0 6px 18px rgba(31,111,235,.3);}
  .btn-play:hover,.btn-next:hover{filter:brightness(1.08);}
  .modes{display:flex;gap:8px;justify-content:center;margin:14px 0 0;flex-wrap:wrap;}
  .mode-btn{border:1px solid var(--border);border-radius:10px;padding:8px 16px;font-size:13px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--muted);transition:all .15s;}
  .mode-btn:hover{border-color:var(--accent);color:var(--text);}
  .mode-btn.active{border-color:var(--accent);color:var(--accent);background:rgba(88,166,255,.12);}
  .auto-switch{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:10px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;background:var(--panel);color:var(--muted);transition:all .15s;user-select:none;}
  .auto-switch:hover{border-color:var(--accent);color:var(--text);}
  .auto-switch input{accent-color:var(--green);cursor:pointer;width:15px;height:15px;}
  .auto-switch.on{border-color:var(--green);color:var(--green);background:rgba(63,185,80,.12);}
  .pbar{display:flex;align-items:center;gap:10px;margin-top:14px;}
  .progress{flex:1;height:7px;background:var(--border);border-radius:4px;overflow:hidden;cursor:pointer;}
  .progress:hover{background:#3a4149;}
  .progress .bar{height:100%;width:0;background:linear-gradient(90deg,#1f6feb,#58a6ff);border-radius:4px;transition:width .9s linear;}
  .ptime{font-size:12px;color:var(--muted);min-width:86px;text-align:right;font-variant-numeric:tabular-nums;}
  .addbar{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:16px 0 0;}
  .btn-add{background:linear-gradient(135deg,#8957e5,#6e40c9);box-shadow:0 6px 18px rgba(137,87,229,.3);}
  .btn-add:hover{filter:brightness(1.08);}
  .btn-add.alt{background:var(--panel);border:1px solid var(--border);color:var(--muted);box-shadow:none;font-weight:600;}
  .btn-add.alt:hover{border-color:var(--accent);color:var(--text);filter:none;}
  .btn-add.danger{background:var(--panel);border:1px solid var(--border);color:var(--muted);box-shadow:none;font-weight:600;}
  .btn-add.danger:hover{border-color:var(--pink);color:var(--pink);filter:none;}
  .btn-add.armed{background:linear-gradient(135deg,#da3633,#b62324)!important;border-color:transparent!important;color:#fff!important;}
  .item .del{background:none;border:none;color:#5a6470;font-size:15px;padding:2px 7px;border-radius:7px;flex-shrink:0;line-height:1;cursor:pointer;box-shadow:none;}
  .item .del:hover{color:var(--pink);background:rgba(255,123,114,.13);filter:none;}
  .empty{text-align:center;color:var(--muted);font-size:14px;padding:36px 18px;border:1px dashed var(--border);border-radius:12px;line-height:2;}
  .addpanel{display:none;margin-top:14px;padding:14px;background:rgba(137,87,229,.07);border:1px solid var(--border);border-radius:12px;flex-direction:column;gap:9px;}
  .addpanel.show{display:flex;}
  .addpanel input{border:1px solid var(--border);background:#0d1117;color:var(--text);border-radius:9px;padding:10px 12px;font-size:14px;font-family:inherit;width:100%;}
  .addpanel input:focus{outline:none;border-color:var(--accent);}
  .addrow{display:flex;gap:9px;}
  .addrow input{flex:1;}
  .addrow button{flex-shrink:0;}
  .addmsg{font-size:12px;color:var(--muted);min-height:16px;}
  .addmsg.err{color:var(--pink);}
  .addmsg.ok{color:var(--green);}
  .searchbar{display:flex;align-items:center;gap:9px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:9px 13px;margin:8px 0 12px;transition:border-color .15s,box-shadow .15s;}
  .searchbar:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(88,166,255,.12);}
  .searchbar .sic{font-size:14px;opacity:.75;flex-shrink:0;}
  .searchbar input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:14px;font-family:inherit;}
  .searchbar input::placeholder{color:#6a7683;}
  .searchbar .sclr{display:none;background:none;border:none;color:#5a6470;font-size:14px;padding:3px 8px;border-radius:7px;box-shadow:none;flex-shrink:0;line-height:1;}
  .searchbar .sclr:hover{color:var(--pink);background:rgba(255,123,114,.13);filter:none;}
  .searchbar.has .sclr{display:block;}
  .srlist{display:flex;flex-direction:column;gap:7px;max-height:330px;overflow-y:auto;}
  .srlist:empty{display:none;}
  .sritem{display:flex;align-items:center;gap:10px;background:#0d1117;border:1px solid var(--border);border-radius:10px;padding:9px 11px;}
  .sritem:hover{border-color:var(--accent);}
  .sritem .srmain{flex:1;min-width:0;}
  .sritem .srt{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sritem .sra{font-size:11px;color:var(--muted);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .sritem .srwarn{color:#f0b429;}
  .sritem .sradd{background:linear-gradient(135deg,#238636,#2ea043);padding:7px 13px;font-size:13px;border-radius:8px;flex-shrink:0;box-shadow:none;}
  .sritem .sradd.done{background:var(--panel);border:1px solid var(--border);color:var(--muted);cursor:default;}
  .list-title{font-size:14px;color:var(--muted);margin:8px 2px 12px;letter-spacing:1px;}
  .list{display:grid;grid-template-columns:1fr;gap:8px;}
  .item{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--border);border-radius:11px;padding:10px 14px;cursor:pointer;transition:border-color .15s;}
  .item:hover{border-color:var(--accent);}
  .item .rank{width:30px;text-align:center;color:var(--muted);font-size:13px;font-weight:700;flex-shrink:0;}
  .item .s{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .item .a{font-size:12px;color:var(--muted);flex-shrink:0;}
  .item .dur{font-size:12px;color:var(--muted);flex-shrink:0;}
  .item .pc{font-size:12px;color:var(--green);flex-shrink:0;min-width:58px;text-align:right;}
  .item.playing{border-color:var(--green);box-shadow:0 0 0 1px var(--green);}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:30px;padding-top:18px;border-top:1px solid var(--border);}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🎵 我的歌单 · 自动连播</h1>
    <div class="sub">点一次「开始」即可 · 之后自动连播、无需再点 · 一个播放器不挤浏览器<br>歌单能搜、能自己增删、能导入导出 · 也能按歌名直接搜着加</div>
  </header>

  <div class="stage">
    <div class="player-box" id="playerBox">
      <div class="unlock" id="unlockBox">
        <div class="big">▶ 点击开始播放</div>
        <div class="tip">只需点这一次，之后自动连播、无需再点<br>（浏览器规定首次播放必须由你手动触发）</div>
        <div class="warn" id="unlockHint">↓ 下方是完整歌单</div>
      </div>
    </div>
    <div class="now">
      <div class="info">
        <div class="label">正在播放 <span id="idxTxt"></span> · <span id="modeTxt">列表播放</span></div>
        <div class="song" id="nowSong">加载中...</div>
        <div class="artist" id="nowArtist"></div>
        <div class="meta" id="nowMeta"></div>
      </div>
      <div class="ctrls">
        <button class="btn-play" id="btnPlay">⏸ 暂停</button>
        <button class="btn-next" id="btnNext">⏭ 下一首</button>
      </div>
    </div>
    <div class="modes" id="modes">
      <button class="mode-btn active" data-mode="list">🔁 列表播放</button>
      <button class="mode-btn" data-mode="random">🎲 随机播放</button>
      <button class="mode-btn" data-mode="one">🔂 单曲循环</button>
      <label class="auto-switch" id="autoSwitch"><input type="checkbox" id="autoChk" checked><span id="autoTxt">自动连播：开</span></label>
    </div>
    <div class="pbar">
      <div class="progress" id="progress"><div class="bar" id="bar"></div></div>
      <div class="ptime" id="ptime">0:00 / 0:00</div>
    </div>
  </div>

  <div class="addbar">
    <button class="btn-add" id="btnAdd">➕ 添加歌曲</button>
    <button class="btn-add alt" id="btnExport">⬇ 导出歌单</button>
    <button class="btn-add alt" id="btnImport">⬆ 导入歌单</button>
    <button class="btn-add alt" id="btnReset">↺ 恢复默认</button>
    <button class="btn-add danger" id="btnClear">🗑 清空歌单</button>
    <input type="file" id="fileImport" accept=".json,application/json" style="display:none">
  </div>
  <div class="addpanel" id="addPanel">
    <input id="inpQuery" placeholder="输入「歌名」或「歌名 歌手」，点右边按钮搜索 → 挑一个添加">
    <div class="addrow">
      <button class="btn-next" id="btnAddOk">🔍 搜索 / 添加</button>
      <button class="mode-btn" id="btnAddCancel">取消</button>
    </div>
    <div class="addrow" id="manualRow" style="display:none">
      <input id="inpSong" placeholder="歌名（必填）">
      <input id="inpArtist" placeholder="歌手（可选）">
    </div>
    <div class="addmsg" id="addMsg">也可以直接粘贴 B 站视频链接 / BV 号，会自动识别</div>
    <div class="srlist" id="srList"></div>
  </div>

  <div class="searchbar" id="searchBar">
    <span class="sic">🔍</span>
    <input id="inpSearch" placeholder="搜歌名或歌手，直接找到那一首（不用一直往下滑）">
    <button class="sclr" id="btnSearchClear" title="清空搜索">✕</button>
  </div>
  <div class="list-title" id="listTitle">歌单（共 <span id="total"></span> 首 · 按播放量排序）</div>
  <div class="list" id="list"></div>

  <footer>内置歌单来自 Apple Music 歌单「听」· 视频为 B 站对应播放量最高版本<br>歌单存在你自己电脑上，可以随便增删 · 也能导出 JSON 分享给别人</footer>
</div>

let current = -1;
let playMode = 'list';       // list | random | one
let autoNext = true;         // 是否自动连播
let unlocked = false;        // 浏览器里需要一次用户点击才允许自动播放
let iframeEl = null;         // 复用的播放器 iframe
let isPaused = false;        // 是否暂停
let curDur = 0;              // 当前曲时长(秒)
let seeking = false;         // 是否正在拖动进度条
let nextLock = 0;            // 切歌冷却，防止重复触发
let userPaused = false;      // 用户是否手动暂停
let nudgeLeft = 0;           // 自动播放兜底重试次数
let loadAt = 0;              // 本首开始播放的时间戳（浏览器兜底联网用）

const playerBox = document.getElementById('playerBox');
const listEl = document.getElementById('list');
const barEl = document.getElementById('bar');
const ptimeEl = document.getElementById('ptime');
const unlockBox = document.getElementById('unlockBox');
const IS_ELECTRON = navigator.userAgent.indexOf('Electron') >= 0;

// ===== 歌单存储：整张歌单都存在本地，可以完全自己增删 =====
const DEFAULT_SONGS = SONGS.slice();     // 内置默认歌单的原始副本（「恢复默认」用）
const PL_KEY = 'myList_v1';              // 本地歌单的存储键

(function applyStoredList() {
  let raw = null;
  try { raw = JSON.parse(localStorage.getItem(PL_KEY)); } catch (e) { }
  if (Array.isArray(raw)) {
    SONGS.length = 0;
    raw.forEach(function (s) { if (s && s.bvid) SONGS.push(s); });
    return;
  }
  // 兼容早期版本：那时候 mySongs 里只放"自己加的"，默认歌单写死在页面里
  let old = null;
  try { old = JSON.parse(localStorage.getItem('mySongs') || '[]'); } catch (e) { }
  if (Array.isArray(old)) {
    old.forEach(function (s) {
      if (s && s.bvid && !SONGS.some(function (x) { return x.bvid === s.bvid; })) SONGS.push(s);
    });
  }
})();
SONGS.sort(function (a, b) { return (b.play || 0) - (a.play || 0); });

function saveList() {
  try { localStorage.setItem(PL_KEY, JSON.stringify(SONGS)); } catch (e) { }
}

// ===== 数据版本迁移 =====
// 内置歌单更新时（比如把「现场版」统一换成录音室原版），
// 把你本地歌单里同一首的歌同步成新版本，但你自己加的歌、删的歌照旧保留。
const LIST_VER = 'v2-studio';
(function migrateListVersion() {
  let ver = null;
  try { ver = localStorage.getItem('myList_ver'); } catch (e) { }
  if (ver === LIST_VER) return;
  const map = {};
  DEFAULT_SONGS.forEach(function (s) { map[s.song + '|' + (s.artist || '')] = s; });
  let changed = false;
  SONGS.forEach(function (s) {
    const n = map[s.song + '|' + (s.artist || '')];
    if (n && n.bvid && n.bvid !== s.bvid) {
      s.bvid = n.bvid;
      s.title = n.title;
      s.dur = n.dur;
      s.durTxt = n.durTxt;
      s.play = n.play;
      s.playTxt = n.playTxt;
      changed = true;
    }
  });
  try { localStorage.setItem('myList_ver', LIST_VER); } catch (e) { }
  if (changed) saveList();
})();

function esc(t) {
  return String(t == null ? '' : t).replace(/[&<>"]/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}

function fmtDur(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  return Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');
}

// ===== 搜索过滤（只筛显示，不动原始顺序）=====
let keyword = '';
function matches(s, kw) {
  return String(s.song || '').toLowerCase().indexOf(kw) >= 0
    || String(s.artist || '').toLowerCase().indexOf(kw) >= 0
    || String(s.title || '').toLowerCase().indexOf(kw) >= 0;
}

// ===== 渲染歌单 =====
function renderList() {
  listEl.innerHTML = '';
  const kw = keyword.trim().toLowerCase();
  const view = [];
  SONGS.forEach(function (s, i) { if (!kw || matches(s, kw)) view.push({ s: s, i: i }); });

  const ltEl = document.getElementById('listTitle');
  if (kw) ltEl.innerHTML = '🔍「' + esc(keyword.trim()) + '」找到 <span id="total"></span> 首 · 点右侧 ✕ 就能删';
  else ltEl.innerHTML = '歌单（共 <span id="total"></span> 首 · 按播放量排序）';

  if (!SONGS.length) {
    listEl.innerHTML = '<div class="empty">歌单还是空的 🙂<br>'
      + '点上面的「➕ 添加歌曲」，输入歌名搜一下就能加<br>'
      + '也可以点「⬆ 导入歌单」导入别人分享给你的 JSON</div>';
    document.getElementById('total').textContent = '0';
    const uh0 = document.getElementById('unlockHint');
    if (uh0) uh0.textContent = '↓ 先往歌单里加几首歌吧';
    return;
  }

  if (!view.length) {
    listEl.innerHTML = '<div class="empty">没找到「' + esc(keyword.trim()) + '」🙂<br>'
      + '换个词试试 · 或者点搜索框右边的「✕」看全部</div>';
    document.getElementById('total').textContent = '0';
    const uhx = document.getElementById('unlockHint');
    if (uhx) uhx.textContent = '↓ 下方是完整歌单（共 ' + SONGS.length + ' 首）';
    return;
  }

  view.forEach(function (o) {
    const s = o.s, i = o.i;
    const d = document.createElement('div');
    d.className = 'item';
    d.dataset.idx = i;
    d.innerHTML = '<div class="rank">' + (i + 1) + '</div>'
      + '<div class="s">' + esc(s.song) + '</div>'
      + '<div class="a">' + esc(s.artist) + '</div>'
      + '<div class="dur">' + esc(s.durTxt || (s.dur ? fmtDur(s.dur) : '—')) + '</div>'
      + '<div class="pc">' + (s.playTxt ? '▶ ' + esc(s.playTxt) : '') + '</div>'
      + '<button class="del" title="从歌单删掉这首">✕</button>';
    if (i === current) d.classList.add('playing');
    d.onclick = function () { playIndex(i); };
    d.querySelector('.del').onclick = function (ev) {
      ev.stopPropagation();
      removeAt(i);
    };
    listEl.appendChild(d);
  });
  document.getElementById('total').textContent = view.length;
  const uh = document.getElementById('unlockHint');
  if (uh) uh.textContent = '↓ 下方是完整歌单（共 ' + SONGS.length + ' 首）';
}

// ===== 删掉某一首 =====
function removeAt(i) {
  if (i < 0 || i >= SONGS.length) return;
  const wasCur = (i === current);
  SONGS.splice(i, 1);
  saveList();
  renderList();
  if (!SONGS.length) {
    current = -1;
    if (iframeEl) iframeEl.src = 'about:blank';
    document.getElementById('nowSong').textContent = '歌单是空的';
    document.getElementById('nowArtist').textContent = '';
    document.getElementById('nowMeta').textContent = '';
    document.getElementById('idxTxt').textContent = '';
    barEl.style.width = '0%';
    ptimeEl.textContent = '0:00 / 0:00';
    return;
  }
  if (wasCur) playIndex(Math.min(i, SONGS.length - 1));
  else if (i < current) { current--; updateNow(current); }
}

function updateNow(i) {
  const s = SONGS[i];
  document.getElementById('nowSong').textContent = s.song;
  document.getElementById('nowArtist').textContent = s.artist || '';
  document.getElementById('nowMeta').textContent =
    (s.playTxt ? '播放量 ' + s.playTxt + ' · ' : '') + '时长 ' + (s.durTxt || (s.dur ? fmtDur(s.dur) : '未知'));
  document.getElementById('idxTxt').textContent = (i + 1) + ' / ' + SONGS.length;
  document.querySelectorAll('.item').forEach(function (el) {
    el.classList.toggle('playing', Number(el.dataset.idx) === i);
  });
}

// ===== 加载某一首（复用同一个播放器，只改地址）=====
function loadIndex(i) {
  const s = SONGS[i];
  const url = 'https://player.bilibili.com/player.html?bvid=' + s.bvid
    + '&high_quality=1&danmaku=0&autoplay=1';
  if (!iframeEl) {
    iframeEl = document.createElement('iframe');
    iframeEl.setAttribute('scrolling', 'no');
    iframeEl.setAttribute('frameborder', 'no');
    iframeEl.setAttribute('allowfullscreen', 'true');
    iframeEl.setAttribute('allow', 'autoplay; fullscreen; encrypted-media');
    iframeEl.setAttribute('referrerpolicy', 'no-referrer-when-downgrade');
    playerBox.appendChild(iframeEl);
  }
  iframeEl.src = url;
  barEl.style.width = '0%';
  ptimeEl.textContent = '0:00 / ' + (s.durTxt || (s.dur ? fmtDur(s.dur) : '--:--'));
  curDur = s.dur || 0;
  isPaused = false;
  userPaused = false;
  nudgeLeft = 3;
  loadAt = Date.now();
  const bp = document.getElementById('btnPlay');
  if (bp) bp.textContent = '⏸ 暂停';
}

function playIndex(i) {
  if (!SONGS.length) { renderList(); return; }
  if (i < 0 || i >= SONGS.length) i = 0;
  current = i;
  updateNow(i);
  if (unlocked) { loadIndex(i); nextLock = Date.now() + 2500; }
  else { barEl.style.width = '0%'; }
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function playNext() {
  if (!SONGS.length) return;
  if (current < 0) { playIndex(0); return; }
  if (playMode === 'one') { playIndex(current); return; }
  let next;
  if (playMode === 'random') {
    do { next = Math.floor(Math.random() * SONGS.length); } while (next === current && SONGS.length > 1);
  } else {
    next = (current + 1) % SONGS.length;
  }
  playIndex(next);
}

// ===== 读播放器真实进度，同步进度条 & 自动切歌 =====
// 关键：判断依据是视频本身的 currentTime / duration，
// 所以无论你怎么拖动 B 站进度条，只要这首歌真正播完，就会自动切下一首
async function pollState() {
  if (!iframeEl) return;
  if (!(window.__playerCtl && window.__playerCtl.state)) { pollBrowser(); return; }
  let st = null;
  try { st = await window.__playerCtl.state(); } catch (e) { return; }
  if (!st || !st.d || !isFinite(st.d) || st.d <= 0) return;

  curDur = st.d;
  if (!seeking) {
    barEl.style.width = Math.min(100, st.t / st.d * 100) + '%';
    ptimeEl.textContent = fmtDur(st.t) + ' / ' + fmtDur(st.d);
  }
  // 暂停状态双向同步（你在播放器里点暂停，按钮也会跟着变）
  if (st.p !== isPaused) {
    isPaused = st.p;
    const bp = document.getElementById('btnPlay');
    if (bp) bp.textContent = isPaused ? '▶ 继续' : '⏸ 暂停';
  }
  // 真正播完 → 切下一首（留 1.2 秒余量）
  if (autoNext && st.d > 2 && st.t >= st.d - 1.2 && Date.now() > nextLock) {
    nextLock = Date.now() + 2500;
    playNext();
    return;
  }
  // 兜底：刚切歌时若没自动播起来，主动催一下
  if (!userPaused && st.p && st.t < 3 && nudgeLeft > 0 && Date.now() > nextLock) {
    nudgeLeft--;
    controlVideo('play');
  }
}

// ===== 浏览器里没有 Electron 通道，用"已知时长 + 计时"兜底自动连播 =====
function pollBrowser() {
  if (!unlocked) return;
  if (userPaused) return;
  const total = (curDur && curDur > 0) ? curDur : 240;   // 网页版拿不到时长时按 4 分钟估
  const el = (Date.now() - loadAt) / 1000;
  if (el > total + 60) return;
  if (!seeking) {
    barEl.style.width = Math.min(100, el / total * 100) + '%';
    ptimeEl.textContent = fmtDur(Math.min(el, total)) + ' / ' + (curDur > 0 ? fmtDur(curDur) : '--:--');
  }
  if (autoNext && el >= total - 1.0 && Date.now() > nextLock) {
    nextLock = Date.now() + 2500;
    playNext();
  }
}

// ===== 控制播放器（暂停/播放）=====
function findVideo(win) {
  try { const v = win.document.querySelector('video'); if (v) return v; } catch (e) { }
  try {
    const fs = win.document.querySelectorAll('iframe');
    for (let i = 0; i < fs.length; i++) {
      try { const r = findVideo(fs[i].contentWindow); if (r) return r; } catch (e) { }
    }
  } catch (e) { }
  return null;
}

function controlVideo(action) {
  try {
    if (window.__playerCtl && window.__playerCtl.control) {
      window.__playerCtl.control(action);
      return true;
    }
  } catch (e) { }
  if (!iframeEl) return false;
  try {
    const v = findVideo(iframeEl.contentWindow);
    if (v) { action === 'pause' ? v.pause() : v.play(); return true; }
  } catch (e) { }
  try {
    iframeEl.contentWindow.postMessage(JSON.stringify({ command: action }), '*');
    iframeEl.contentWindow.postMessage({ type: action }, '*');
  } catch (e) { }
  return false;
}

// ===== 解锁（浏览器要求首次播放需用户点击）=====
function ensureUnlocked() {
  if (unlocked) return;
  unlocked = true;
  unlockBox.classList.add('hide');
  loadIndex(current < 0 ? 0 : current);
  nextLock = Date.now() + 2500;
}
unlockBox.onclick = ensureUnlocked;
document.addEventListener('click', function () { if (!unlocked) ensureUnlocked(); }, true);

// ===== 按钮 =====
document.getElementById('btnNext').onclick = playNext;

document.getElementById('btnPlay').onclick = function () {
  const willPause = !isPaused;
  controlVideo(willPause ? 'pause' : 'play');
  isPaused = willPause;
  userPaused = willPause;
  if (!willPause) nudgeLeft = 3;
  this.textContent = willPause ? '▶ 继续' : '⏸ 暂停';
};

// ===== 进度条点击/拖动跳转 =====
function seekByEvent(e) {
  if (curDur <= 0) return;
  const rect = document.getElementById('progress').getBoundingClientRect();
  let pct = (e.clientX - rect.left) / rect.width;
  pct = Math.min(1, Math.max(0, pct));
  barEl.style.width = (pct * 100) + '%';
  ptimeEl.textContent = fmtDur(pct * curDur) + ' / ' + fmtDur(curDur);
  if (window.__playerCtl && window.__playerCtl.seek) window.__playerCtl.seek(pct * curDur);
  else loadAt = Date.now() - pct * curDur * 1000;   // 浏览器兜底：把计时基线挪过去
}
(function () {
  const pr = document.getElementById('progress');
  pr.addEventListener('mousedown', function () { seeking = true; });
  document.addEventListener('mouseup', function () { seeking = false; });
  pr.addEventListener('click', seekByEvent);
})();

// ===== 播放模式 =====
document.querySelectorAll('.mode-btn[data-mode]').forEach(function (btn) {
  btn.onclick = function () {
    playMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn[data-mode]').forEach(function (b) {
      b.classList.toggle('active', b === btn);
    });
    document.getElementById('modeTxt').textContent =
      { list: '列表播放', random: '随机播放', one: '单曲循环' }[playMode];
  };
});

// ===== 自动连播开关 =====
const autoChk = document.getElementById('autoChk');
const autoSwitch = document.getElementById('autoSwitch');
function syncAuto() {
  autoNext = autoChk.checked;
  document.getElementById('autoTxt').textContent = '自动连播：' + (autoNext ? '开' : '关');
  autoSwitch.classList.toggle('on', autoNext);
}
autoChk.onchange = syncAuto;

// ===== 歌单搜索框：一边打字一边筛，找到直接删 =====
const searchBarEl = document.getElementById('searchBar');
const inpSearchEl = document.getElementById('inpSearch');
inpSearchEl.addEventListener('input', function () {
  keyword = inpSearchEl.value;
  searchBarEl.classList.toggle('has', !!keyword.trim());
  renderList();
});
inpSearchEl.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') document.getElementById('btnSearchClear').click();
});
document.getElementById('btnSearchClear').onclick = function () {
  inpSearchEl.value = '';
  keyword = '';
  searchBarEl.classList.remove('has');
  renderList();
  inpSearchEl.focus();
};

// 增删整张歌单时，把搜索过滤一起清掉（否则用户会以为操作没生效）
function clearSearch() {
  if (!keyword && !inpSearchEl.value) return;
  inpSearchEl.value = '';
  keyword = '';
  searchBarEl.classList.remove('has');
}

// ===== 添加歌曲 =====
const srListEl = document.getElementById('srList');
const manualRow = document.getElementById('manualRow');

function setAddMsg(text, cls) {
  const el = document.getElementById('addMsg');
  el.textContent = text || '';
  el.className = 'addmsg' + (cls ? ' ' + cls : '');
}

// 把一首歌加进歌单（查重 + 重排 + 存盘 + 重绘）
function addSongObj(info) {
  if (!info || !info.bvid) return false;
  if (SONGS.some(function (x) { return x.bvid === info.bvid; })) return false;
  info.__custom = true;
  SONGS.push(info);
  SONGS.sort(function (a, b) { return (b.play || 0) - (a.play || 0); });
  saveList();
  clearSearch();   // 让新加的歌立刻可见
  renderList();
  return true;
}

// 渲染搜索结果（点「＋ 添加」直接入歌单）
function renderSearchResults(list) {
  srListEl.innerHTML = '';
  list.forEach(function (it) {
    const d = document.createElement('div');
    d.className = 'sritem';
    d.innerHTML = '<div class="srmain">'
      + '<div class="srt">' + esc(it.title) + '</div>'
      + '<div class="sra">' + esc(it.artist) + ' · ' + esc(it.durTxt) + ' · ▶ ' + esc(it.playTxt)
      + (it.suspect ? ' · <span class="srwarn">⚠ 疑似' + esc(it.suspect) + '</span>' : '')
      + '</div></div>';
    const b = document.createElement('button');
    if (SONGS.some(function (x) { return x.bvid === it.bvid; })) {
      b.className = 'sradd done';
      b.textContent = '已在歌单';
    } else {
      b.className = 'sradd';
      b.textContent = '＋ 添加';
      b.onclick = function () {
        if (addSongObj({
          song: it.song, artist: it.artist, bvid: it.bvid, play: it.play,
          playTxt: it.playTxt, title: it.title, dur: it.dur, durTxt: it.durTxt
        })) {
          b.className = 'sradd done';
          b.textContent = '已添加 ✓';
          setAddMsg('✅ 已添加：' + it.song + (it.artist ? ' - ' + it.artist : '') + '（' + it.durTxt + '）', 'ok');
        }
      };
    }
    d.appendChild(b);
    srListEl.appendChild(d);
  });
}

// 直接按 BV 号添加（粘贴链接的场景）
async function addByBvid(bvid) {
  if (SONGS.some(function (x) { return x.bvid === bvid; })) { setAddMsg('这首歌已经在歌单里了', 'err'); return; }
  const nm = document.getElementById('inpSong').value.trim();
  const ar = document.getElementById('inpArtist').value.trim();
  if (window.__playerCtl && window.__playerCtl.addSong) {
    setAddMsg('正在获取视频信息…');
    let info = null;
    try { info = await window.__playerCtl.addSong({ bvid: bvid, song: nm, artist: ar }); } catch (e) { }
    if (!info || info.error) { setAddMsg((info && info.error) || '添加失败，请重试', 'err'); return; }
    addSongObj(info);
    setAddMsg('✅ 已添加：' + info.song + (info.artist ? ' - ' + info.artist : '')
      + (info.durTxt ? '（' + info.durTxt + '）' : ''), 'ok');
    document.getElementById('inpQuery').value = '';
    srListEl.innerHTML = '';
    manualRow.style.display = 'none';
  } else {
    // 网页版读不到 B 站接口（跨域），退化成手动填歌名
    if (!nm) {
      manualRow.style.display = 'flex';
      setAddMsg('网页版读不到视频标题 —— 把「歌名」填上，再点一次按钮就行', 'err');
      document.getElementById('inpSong').focus();
      return;
    }
    addSongObj({ song: nm, artist: ar, bvid: bvid, play: 0, playTxt: '', title: nm, dur: 0, durTxt: '' });
    setAddMsg('✅ 已添加：' + nm + (ar ? ' - ' + ar : '')
      + '（网页版读不到播放量/时长，正常现象）', 'ok');
    document.getElementById('inpQuery').value = '';
    document.getElementById('inpSong').value = '';
    document.getElementById('inpArtist').value = '';
    manualRow.style.display = 'none';
  }
}

document.getElementById('btnAdd').onclick = function () {
  const p = document.getElementById('addPanel');
  p.classList.toggle('show');
  if (p.classList.contains('show')) document.getElementById('inpQuery').focus();
};
document.getElementById('btnAddCancel').onclick = function () {
  document.getElementById('addPanel').classList.remove('show');
  srListEl.innerHTML = '';
  manualRow.style.display = 'none';
};
document.getElementById('inpQuery').addEventListener('keydown', function (e) {
  if (e.key === 'Enter') document.getElementById('btnAddOk').click();
});

// 主按钮：输入里有 BV 号就直接加；否则按歌名/歌手去 B 站搜
document.getElementById('btnAddOk').onclick = async function () {
  const q = document.getElementById('inpQuery').value.trim();
  if (!q) {
    setAddMsg('先输入歌名（或「歌名 歌手」）；也可以粘贴 B 站链接 / BV 号', 'err');
    document.getElementById('inpQuery').focus();
    return;
  }

  const m = q.match(/BV[0-9A-Za-z]{10}/);
  if (m) { await addByBvid(m[0]); return; }

  if (!(window.__playerCtl && window.__playerCtl.search)) {
    setAddMsg('网页版受浏览器跨域限制，没法自动搜 B 站 —— 桌面版(.exe)可以按歌名直接搜；'
      + '这里请粘贴 B 站链接 / BV 号来加歌', 'err');
    return;
  }

  setAddMsg('正在搜「' + q + '」…');
  srListEl.innerHTML = '';
  let r = null;
  try { r = await window.__playerCtl.search(q); } catch (e) { }
  if (!r || r.error) { setAddMsg((r && r.error) || '搜索失败，请重试', 'err'); return; }
  renderSearchResults(r.list || []);
  setAddMsg('找到 ' + (r.list || []).length + ' 个结果 · 点右侧「＋ 添加」挑一个'
    + '（带 ⚠ 的可能是翻唱/合集/乐器版，注意挑原唱）', 'ok');
};

// ===== 危险操作要"再点一次"确认，避免误点 =====
function armConfirm(btn, confirmText, fn) {
  let armed = false, timer = null;
  const orig = btn.innerHTML;
  btn.onclick = function () {
    if (!armed) {
      armed = true;
      btn.innerHTML = confirmText;
      btn.classList.add('armed');
      timer = setTimeout(function () {
        armed = false; btn.innerHTML = orig; btn.classList.remove('armed');
      }, 3000);
      return;
    }
    clearTimeout(timer);
    armed = false;
    btn.innerHTML = orig;
    btn.classList.remove('armed');
    fn();
  };
}

// ===== 清空歌单 =====
armConfirm(document.getElementById('btnClear'), '再点一次 = 清空', function () {
  SONGS.length = 0;
  saveList();
  clearSearch();
  renderList();
  current = -1;
  if (iframeEl) { try { iframeEl.src = 'about:blank'; } catch (e) { } }
  document.getElementById('nowSong').textContent = '歌单是空的';
  document.getElementById('nowArtist').textContent = '';
  document.getElementById('nowMeta').textContent = '';
  document.getElementById('idxTxt').textContent = '';
  barEl.style.width = '0%';
  ptimeEl.textContent = '0:00 / 0:00';
  document.getElementById('addPanel').classList.add('show');
  setAddMsg('歌单已清空 —— 点「➕ 添加歌曲」开始建你自己的歌单', 'ok');
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

// ===== 恢复默认歌单 =====
armConfirm(document.getElementById('btnReset'), '再点一次 = 恢复', function () {
  SONGS.length = 0;
  DEFAULT_SONGS.forEach(function (s) { SONGS.push(s); });
  SONGS.sort(function (a, b) { return (b.play || 0) - (a.play || 0); });
  saveList();
  clearSearch();
  renderList();
  document.getElementById('addPanel').classList.add('show');
  setAddMsg('已恢复内置默认歌单，共 ' + SONGS.length + ' 首', 'ok');
  if (unlocked) playIndex(0);
});

// ===== 导出歌单 =====
document.getElementById('btnExport').onclick = function () {
  document.getElementById('addPanel').classList.add('show');
  if (!SONGS.length) { setAddMsg('歌单是空的，先加几首歌再导出', 'err'); return; }
  const blob = new Blob([JSON.stringify(SONGS, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '我的歌单.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  setAddMsg('✅ 已导出 ' + SONGS.length + ' 首，把 我的歌单.json 发给朋友即可', 'ok');
};

// ===== 导入歌单 =====
document.getElementById('btnImport').onclick = function () {
  document.getElementById('fileImport').click();
};
document.getElementById('fileImport').onchange = function (e) {
  const f = e.target.files && e.target.files[0];
  if (!f) return;
  document.getElementById('addPanel').classList.add('show');
  const r = new FileReader();
  r.onload = function () {
    let arr = null;
    try { arr = JSON.parse(r.result); } catch (err) { }
    if (!Array.isArray(arr)) { setAddMsg('导入失败：文件格式不对（要页面导出的那个 .json）', 'err'); return; }
    const clean = arr.filter(function (x) {
      return x && x.bvid && String(x.bvid).indexOf('BV') === 0 && x.song;
    });
    if (!clean.length) { setAddMsg('导入失败：文件里没有有效的歌', 'err'); return; }
    SONGS.length = 0;
    clean.forEach(function (x) { SONGS.push(x); });
    SONGS.sort(function (a, b) { return (b.play || 0) - (a.play || 0); });
    saveList();
    clearSearch();
    renderList();
    if (unlocked && SONGS.length) playIndex(0);
    setAddMsg('✅ 导入成功，现在共 ' + SONGS.length + ' 首', 'ok');
  };
  r.readAsText(f);
  e.target.value = '';
};

// ===== 初始化 =====
renderList();
syncAuto();

if (IS_ELECTRON) {
  unlocked = true;
  unlockBox.classList.add('hide');
}

if (SONGS.length) playIndex(0);
setInterval(pollState, 1000);

</script>
</body>
